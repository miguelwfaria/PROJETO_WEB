<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojinha do Meowth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lojinha do Meowth</h1>
        <p>Pokémon TCG e Action Figures</p>
    </header>

    <main class="container">
        <section class="produtos-area">
            <h2>Produtos</h2>

            <label for="filtro">Filtrar produtos:</label>
            <select id="filtro">
                <option value="todos">Todos</option>
                <option value="ate50">Produtos até R$50</option>
                <option value="acima50">Produtos acima de R$50</option>
            </select>

            <div id="lista-produtos"></div>
        </section>

        <section class="carrinho-area">
            <h2>Carrinho</h2>
            <div id="lista-carrinho"></div>
            <h3 id="total">Total: R$ 0,00</h3>
            <button id="limpar-carrinho">Limpar carrinho</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
